services:
  ferry-iceberg-check:
    build: .
    image: ferry-iceberg-check:latest
    init: true
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_MB: "512"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
